# Connectivity
listen_addresses = '*'
max_connections = 150

# Memory settings (Default calibrated for a 4GB-8GB RAM instance)
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 16MB

# Write Ahead Log (WAL)
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Query Tuning
random_page_cost = 1.1                  # Fast SSD assumption
effective_io_concurrency = 200

# Logging
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 250        # Log any query slower than 250ms