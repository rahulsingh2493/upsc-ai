[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahul Singh", email = "rahulmessi086@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.9.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "httpx2>=2.16.0",
    "itsdangerous>=2.2.0",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
